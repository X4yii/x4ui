plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.3'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = 'r1.0b6'
group = 'com.x4yi.x4ui'
base {
    archivesName = 'x4ui'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

sourceSets {
    java21 {
        java {
            srcDir 'src/main/java21'
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava21Java', JavaCompile) {
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
    options.release.set(21)
    classpath += sourceSets.main.output + sourceSets.main.compileClasspath
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'snapshot'
    mcpMappingVersion = '20171003'
    username = 'Developer'
}

repositories {
    mavenCentral()
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
    }
    maven {
        name = 'Progwml6 maven'
        url = 'https://dvs1.progwml6.com/files/maven/'
    }
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    embed 'org.jcodec:jcodec:0.2.5'
    embed 'org.jcodec:jcodec-javase:0.2.5'
    compileOnly 'mezz.jei:jei_1.12.2:4.15.0.297:api'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    testImplementation 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    configurations = [project.configurations.embed]
    archiveClassifier.set('dev')
    relocate 'org.jcodec', 'com.x4yi.x4ui.shaded.jcodec'
    into('META-INF/versions/21') {
        from sourceSets.java21.output
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes([
            'Specification-Title'     : 'x4ui',
            'Specification-Vendor'    : 'x4yi',
            'Specification-Version'   : project.version,
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'x4yi',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Multi-Release'           : 'true'
        ])
    }
}

tasks.named('reobfJar') {
    inputJar.set(tasks.named('shadowJar').flatMap { it.archiveFile })
}

tasks.named('jar') {
    enabled = false
}

tasks.named('assemble') {
    dependsOn tasks.named('reobfJar')
}

tasks.register('testJava21', Test) {
    description = 'Runs unit tests under Java 21 against the Multi-Release JAR (CleanroomMC runtime).'
    group = 'verification'
    dependsOn tasks.named('shadowJar'), tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(
        sourceSets.test.output,
        tasks.named('shadowJar').flatMap { it.archiveFile },
        tasks.named('test', Test).map { it.classpath - sourceSets.main.output }
    )
}

tasks.named('check') {
    dependsOn tasks.named('testJava21')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('reobfJar')
        }
    }
}
