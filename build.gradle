buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:2.3-1.0.8'
    }
}
repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
version = "r1.0b5"
group = "com.x4yi.x4ui"
archivesBaseName = "x4ui"
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.12.2-14.23.5.2847'
    runDir  = 'run'
    mappings = 'snapshot_20171003'
}
configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    embed 'org.jcodec:jcodec:0.2.5'
    embed 'org.jcodec:jcodec-javase:0.2.5'
    compileOnly 'mezz.jei:jei_1.12.2:4.15.0.297:api'
    testCompile 'junit:junit:4.12'
}
tasks.withType(JavaExec) {
    if (name == 'runClient') {
        def wayland = System.getenv('WAYLAND_DISPLAY')
        def x11     = System.getenv('DISPLAY')
        if (wayland) {
            environment 'WAYLAND_DISPLAY', wayland
            if (x11) {
                environment 'DISPLAY', x11
            } else {
                environment 'DISPLAY', ':0'
            }
        } else if (x11) {
            environment 'DISPLAY', x11
        } else {
            environment 'DISPLAY', ':0'
        }
        environment '_JAVA_AWT_WM_NONREPARENTING', '1'
        jvmArgs '-Xmx768M'
        jvmArgs '-Dorg.lwjgl.opengl.Display.allowSoftwareOpenGL=true'
        jvmArgs '-Djava.awt.headless=false'
    }
}
jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    manifest {
        attributes([
            "Specification-Title"     : "x4ui",
            "Specification-Vendor"    : "x4yi",
            "Specification-Version"   : "${version}",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "x4yi",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}
jar.finalizedBy 'reobfJar'
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
}
